spring:
  main:
    banner-mode: OFF
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6541/stats
    username: stats
    password: stats

kafka:
  consumer:
    user-action:
      bootstrap-servers: localhost:9092
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: ru.practicum.avro.UserActionDeserializer
      enable-auto-commit: false
      client-id: analyzer-user-consumer
      group-id: analyzer.user.group
      auto-offset-reset: latest
      max-poll-records: 5
      max-poll-interval: 60000
    event-similarity:
      bootstrap-servers: localhost:9092
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: ru.practicum.avro.EventSimilarityDeserializer
      enable-auto-commit: false
      client-id: analyzer-event-consumer
      group-id: analyzer.event.group
      auto-offset-reset: latest
      max-poll-records: 5
      max-poll-interval: 60000

grpc:
  server:
    port: 0