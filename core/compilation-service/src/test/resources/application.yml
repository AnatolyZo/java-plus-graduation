spring:
  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

eureka:
  client:
    enabled: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        ignore-exceptions:
          - ru.practicum.feign.exception.RemoteCallBusinessException
        sliding-window-size: 5
        minimum-number-of-calls: 5 #значение установлено для проверки срабатывания CircuitBreaker в тестах
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3