spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:analytics;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=TIMESTAMP
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

eureka:
  client:
    enabled: false